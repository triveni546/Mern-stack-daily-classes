<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let age=Number(prompt("Enter ur age"));
        let mypromise=new Promise((resolve, reject)=>{
            if(age>=18){
                console.log("major");
                resolve("This  is user major");
            }
            else{
                console.log("minor");
               reject("this user is minor");
            }
        })
            
        mypromise.then((res) => {console.log(res)}).catch((err)=>{
            console.error(err);
        })
        
    </script>
</body> 
</html>
